<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DuckDuckGo J-Model Client</title>
    <style>
        :root {
            --bg-primary: #1c1c1e;
            --bg-chat: #2c2c2e;
            --accent: #de5833;
            --text-light: #ffffff;
            --text-dim: #a1a1aa;
        }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            padding: 20px;
            background-color: var(--bg-chat);
            border-bottom: 1px solid #3a3a3c;
            text-align: center;
        }
        h1 { margin: 0; font-size: 1.5rem; color: var(--accent); }
        .subtitle { color: var(--text-dim); font-size: 0.85rem; margin-top: 4px; }
        
        #workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        #avatar-container {
            width: 350px;
            background: #252527;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 1px solid #3a3a3c;
        }
        #chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
        }
        #chat-history {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .msg { padding: 12px 16px; border-radius: 12px; max-width: 75%; line-height: 1.4; word-wrap: break-word;}
        .user { background-color: #3a3a3c; align-self: flex-end; }
        .ai { background-color: var(--bg-chat); border-left: 4px solid var(--accent); align-self: flex-start; }
        
        #input-area {
            padding: 20px;
            background: var(--bg-chat);
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #48484a;
            background: #3a3a3c;
            color: white;
            font-size: 1rem;
        }
        input:focus { outline: 2px solid var(--accent); }
        button {
            padding: 0 24px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { opacity: 0.9; }
        #status-node { color: var(--text-dim); margin-top: 15px; font-size: 0.9rem; font-style: italic; }
    </style>
</head>
<body>

<header>
    <h1>DuckDuckGo // J-Model</h1>
    <div class="subtitle">🔒 Secure Local Client • Real-Time Face Expression Stream</div>
</header>

<div id="workspace">
    <div id="avatar-container">
        <!-- Responsive SVG AI Face Frame -->
        <svg id="j-face" width="200" height="200" viewBox="0 0 200 200">
            <!-- Face Outline Background -->
            <circle cx="100" cy="100" r="85" fill="#2c2c2e" stroke="#de5833" stroke-width="4"/>
            <!-- Left Eyebrow & Eye -->
            <path id="left-brow" d="M 55 70 Q 65 65 75 70" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>
            <circle id="left-eye" cx="65" cy="85" r="8" fill="white"/>
            <!-- Right Eyebrow & Eye -->
            <path id="right-brow" d="M 125 70 Q 135 65 145 70" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>
            <circle id="right-eye" cx="135" cy="85" r="8" fill="white"/>
            <!-- Dynamic Reactive Mouth -->
            <path id="mouth" d="M 70 130 Q 100 130 130 130" stroke="#de5833" stroke-width="5" fill="none" stroke-linecap="round"/>
        </svg>
        <div id="status-node">Idle</div>
    </div>

    <div id="chat-container">
        <div id="chat-history">
            <div class="msg ai">Hi, I'm J-Model. Ask me anything privately. Watch my face change as I think and reply!</div>
        </div>
        <div id="input-area">
            <input type="text" id="user-input" placeholder="Type a message privately..." autocomplete="off">
            <button id="send-btn">Send</button>
        </div>
    </div>
</div>

<script>
    const mouth = document.getElementById('mouth');
    const leftBrow = document.getElementById('left-brow');
    const rightBrow = document.getElementById('right-brow');
    const statusNode = document.getElementById('status-node');
    const history = document.getElementById('chat-history');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    let speakInterval = null;

    // Expression Presets via SVG path manipulators
    function setFace(mood) {
        if(mood === 'happy') {
            mouth.setAttribute('d', 'M 70 125 Q 100 150 130 125');
            leftBrow.setAttribute('d', 'M 55 68 Q 65 60 75 68');
            rightBrow.setAttribute('d', 'M 125 68 Q 135 60 145 68');
        } else if(mood === 'thinking') {
            mouth.setAttribute('d', 'M 85 130 Q 100 130 115 130'); 
            leftBrow.setAttribute('d', 'M 55 72 Q 65 72 75 68');
            rightBrow.setAttribute('d', 'M 125 68 Q 135 72 145 72');
        } else if(mood === 'speaking') {
            leftBrow.setAttribute('d', 'M 55 68 Q 65 63 75 68');
            rightBrow.setAttribute('d', 'M 125 68 Q 135 63 145 68');
        } else { // Neutral / Idle
            mouth.setAttribute('d', 'M 70 130 Q 100 130 130 130');
            leftBrow.setAttribute('d', 'M 55 70 Q 65 65 75 70');
            rightBrow.setAttribute('d', 'M 125 70 Q 135 65 145 70');
        }
    }

    function startTalkingAnimation() {
        setFace('speaking');
        let toggle = false;
        speakInterval = setInterval(() => {
            // Animate mouth opening and closing rapidly to mock text output speed
            mouth.setAttribute('d', toggle ? 'M 75 125 Q 100 145 125 125' : 'M 80 130 Q 100 135 120 130');
            toggle = !toggle;
        }, 120);
    }

    function stopTalkingAnimation() {
        clearInterval(speakInterval);
        setFace('happy');
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        // Render User Input bubble
        userInput.value = '';
        const userBubble = document.createElement('div');
        userBubble.className = 'msg user';
        userBubble.textContent = text;
        history.appendChild(userBubble);
        history.scrollTop = history.scrollHeight;

        // Transition face to Thinking state
        statusNode.textContent = "Thinking...";
        setFace('thinking');

        // Create empty wrapper for incoming stream tokens
        const aiBubble = document.createElement('div');
        aiBubble.className = 'msg ai';
        history.appendChild(aiBubble);

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            
            statusNode.textContent = "J-Model is replying...";
            startTalkingAnimation();

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                
                const token = decoder.decode(value, { stream: true });
                aiBubble.textContent += token;
                history.scrollTop = history.scrollHeight;
            }
        } catch (err) {
            aiBubble.textContent = "Could not establish secure communication pipeline.";
        } finally {
            statusNode.textContent = "Idle";
            stopTalkingAnimation();
        }
    }

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') sendMessage(); });
</script>
</body>
</html>
